jenkins:
  systemMessage: "1IPIM CI - Jenkins local (Docker)"
  numExecutors: 2

  securityRealm:
    local:
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD}

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: http://localhost:8081/

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: 1ipim-sftp
              username: ${DEPLOY_USER}
              password: ${DEPLOY_PASS}
              description: SFTP HostGator

jobs:
  - script: |
      pipelineJob('1ipim-ci') {
        description('Build, testes locais, testes no staging e deploy em produção')

        parameters {
          booleanParam('DEPLOY_STAGING', true, 'Publicar e testar no staging')
          booleanParam('DEPLOY_PRODUCTION', false, 'Publicar em produção após os testes (manual)')
          booleanParam('REQUIRE_APPROVAL', false, 'Exigir aprovação manual antes da produção')
        }

        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/generoso28/1ipim.git') }
                branch('*/master')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }

        triggers {
          scm('H/5 * * * *')
        }
      }
